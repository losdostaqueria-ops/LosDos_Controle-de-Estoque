<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste Simples</title>
</head>
<body>
  <h1>Teste</h1>
  <p id="msg">Carregando...</p>

  <script>
    const URL_JSON = "https://raw.githubusercontent.com/losdostaqueria-ops/LosDos_Controle-de-Estoque/refs/heads/main/modules/dados_estoque.json";

    fetch(URL_JSON)
      .then(r => r.json())
      .then(dados => {
        document.getElementById("msg").innerHTML =
          "✅ FUNCIONOU! " + dados.length + " itens carregados.";
      })
      .catch(err => {
        document.getElementById("msg").innerHTML =
          "❌ ERRO: " + err.message;
      });
  </script>
</body>
</html>
