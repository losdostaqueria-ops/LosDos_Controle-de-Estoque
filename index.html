<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Los Dos • Controle de Estoque</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">LD</div>
      <div class="brand-text">
        <h1>Los Dos</h1>
        <span>Gestão Inteligente</span>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="dashboard">
        <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        Dashboard
      </button>
      <button class="nav-item" data-view="produtos">
        <svg viewBox="0 0 24 24"><path d="M20 6h-4V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm-6 0h-4V4h4v2z"/></svg>
        Produtos
      </button>
      <button class="nav-item" data-view="estoque">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v4H4zm0 6h16v4H4zm0 6h16v4H4z"/></svg>
        Estoque
      </button>
      <button class="nav-item" data-view="requisicoes">
        <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 14l-5-5 1.4-1.4L12 14.2l6.6-6.6L20 9l-8 8z"/></svg>
        Requisições
      </button>
      <button class="nav-item" data-view="entradas">
        <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        Entradas
      </button>
      <button class="nav-item" data-view="comprar">
        <svg viewBox="0 0 24 24"><path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM7.2 14.6l.1-.3L8.1 12h7.4l3.1-6H6.2L5.2 4H2v2h2l3.6 7.6L6.2 16a2 2 0 0 0 1.8 3h12v-2H8.4a.25.25 0 0 1-.2-.4z"/></svg>
        Comprar
      </button>
      <button class="nav-item" data-view="ranking">
        <svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
        Ranking
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar">LD</div>
        <div>
          <strong>Administrador</strong>
          <span>Los Dos</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <div class="page-title">
        <h2 id="pageTitle">Dashboard</h2>
        <p id="pageSubtitle">Visão geral em tempo real</p>
      </div>
      <div class="topbar-actions">
        <div class="search-box">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
          <input id="globalSearch" placeholder="Buscar produto, código..." />
        </div>
        <button class="btn-icon" id="btnExport" title="Exportar JSON">
          <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
        </button>
        <button class="btn-icon" id="btnImport" title="Importar JSON">
          <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5z"/></svg>
        </button>
      </div>
    </header>

    <section class="view-container" id="viewContainer">
      <!-- Views injetadas via JS -->
    </section>
  </main>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <input type="file" id="fileInput" accept=".json" hidden />

  <script type="module" src="app.js"></script>
</body>
</html>
